<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Garden Canyon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2365c8c0'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff4dc'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #e6f4f1;
    --dim: #9fbcb8;
    --panel: rgba(6, 20, 22, 0.72);
    --line: rgba(160, 220, 212, 0.22);
    --accent: #8fe0d4;
    --warm: #ffe2a8;
  }
  html, body { margin: 0; height: 100%; background: #041012; overflow: hidden; color: var(--ink);
    font: 13px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 6, 8, 0.55) 100%); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #topleft { position: fixed; top: 16px; left: 16px; padding: 12px 14px; max-width: 330px; }
  #topleft h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: 0.04em; font-weight: 600; }
  #topleft .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  #topleft label { color: var(--dim); font-size: 12px; margin-right: 10px; }
  select { background: #0b2326; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 6px; font: inherit; }
  #help { margin-top: 10px; color: var(--dim); font-size: 12px; }
  #help kbd { display: inline-block; min-width: 16px; padding: 0 5px; margin: 0 1px; border-radius: 4px;
    border: 1px solid var(--line); background: #0b2326; color: var(--ink); font: 11px/18px ui-monospace, monospace; text-align: center; }
  #help.hidden { display: none; }
  #minimap-wrap { position: fixed; top: 16px; right: 16px; padding: 8px; }
  #minimap { display: block; border-radius: 6px; }
  #minimap-wrap .cap { color: var(--dim); font-size: 11px; margin-top: 6px; max-width: 240px; }
  #stats { position: fixed; left: 16px; bottom: 16px; padding: 8px 12px; color: var(--dim); font-size: 12px; }
  #stats b { color: var(--accent); font-size: 14px; }
  #prompt { position: fixed; left: 50%; bottom: 64px; transform: translate(-50%, 10px); padding: 8px 16px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; color: var(--warm); }
  #prompt.show { opacity: 1; transform: translate(-50%, 0); }
  #region { position: fixed; left: 50%; top: 16%; transform: translate(-50%, 8px); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .6s, transform .6s; text-shadow: 0 0 18px rgba(79, 182, 170, .55); }
  #region.show { opacity: 1; transform: translate(-50%, 0); }
  #region .t { font-size: 26px; letter-spacing: .32em; color: #e8fbf6; }
  #region .s { margin-top: 6px; font-size: 12px; letter-spacing: .18em; color: var(--dim); }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%); width: min(420px, calc(100vw - 32px));
    padding: 18px 20px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #panel.show { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  #panel h3 { margin: 0 0 8px; color: var(--warm); font-size: 15px; }
  #panel p { margin: 6px 0; }
  #panel .dim { color: var(--dim); font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #041012; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { width: min(420px, calc(100vw - 48px)); text-align: center; }
  #loading h2 { font-weight: 500; letter-spacing: 0.08em; margin: 0 0 14px; }
  #loading .track { height: 4px; background: #0d2a2d; border-radius: 4px; overflow: hidden; }
  #loading-bar { height: 100%; width: 0; background: linear-gradient(90deg, #4fb6aa, #ffe2a8); transition: width .2s; }
  #loading-label { margin-top: 10px; color: var(--dim); min-height: 1.5em; }
  #loading.error #loading-label { color: #ffb4a0; }
  #drop { position: fixed; inset: 16px; border: 2px dashed var(--accent); border-radius: 14px; display: grid;
    place-items: center; background: rgba(4, 16, 18, 0.7); font-size: 16px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #drop.show { opacity: 1; }
  #tool { position: fixed; right: 16px; bottom: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; --cd: 0; }
  #tool .ico { width: 22px; height: 22px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 40% 35%, #fff4dc 0 18%, #8fe0d4 45%, #1d5552 100%); box-shadow: 0 0 10px #8fe0d488; }
  #tool.cooling .ico::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(rgba(4, 16, 18, 0.75) calc(var(--cd) * 360deg), transparent 0); }
  #tool:hover { border-color: var(--accent); }
  #bigmap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2, 8, 10, 0.62);
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  #bigmap.show { opacity: 1; pointer-events: auto; }
  #bigmap .frame { padding: 14px; max-width: calc(100vw - 32px); }
  #bigmap .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  #bigmap .head b { font-size: 15px; }
  #bigmap-hint { color: var(--dim); font-size: 12px; flex: 1; }
  #bigmap button { background: #0b2326; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 10px; font: inherit; cursor: pointer; }
  #bigmap button:hover { border-color: var(--accent); }
  #bigmap canvas { display: block; margin: 0 auto; border-radius: 8px; cursor: crosshair; }
  #bigmap .modules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
  #bigmap .modules button { min-width: 38px; }
  #bigmap .modules button.current { border-color: var(--warm); color: var(--warm); }
  #bigmap .waypoints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
  #bigmap .waypoints button { font-size: 12px; }
  #bigmap .waypoints .k-chamber { border-color: rgba(143, 224, 212, 0.5); }
  #bigmap .waypoints .k-slot { border-color: rgba(255, 228, 170, 0.5); }
  @media (max-width: 640px) {
    #minimap-wrap { display: none; }
    #topleft { right: 16px; max-width: none; }
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
    }
  }
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="topleft" class="panel">
  <h1>Ant Garden · 蚁穴峡谷</h1>
  <div class="sub" id="path-name">由 Path Recognize 路径生成</div>
  <label>路径 <select id="sample">
    <optgroup label="路径模块（path image）" id="module-options"></optgroup>
    <optgroup label="拼接（多个六边形）">
      <option value="stitch:row:path-010,path-013">拼接 010 + 013</option>
      <option value="stitch:row:path-006,path-010,path-013">拼接 006 + 010 + 013</option>
      <option value="stitch:cluster:path-001,path-002,path-003">三角拼接 001 + 002 + 003</option>
    </optgroup>
    <optgroup label="其他">
      <option value="gray">灰度蚁穴示例</option>
      <option value="color">彩色蚁穴示例</option>
      <option value="custom">自定义（拖入 JSON）</option>
    </optgroup>
  </select></label>
  <label>画质 <select id="quality">
    <option value="low">低</option>
    <option value="medium">中</option>
    <option value="high">高</option>
  </select></label>
  <div id="help">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 爬行 · <kbd>Shift</kbd> 快爬 · 拖动鼠标转镜头 · 滚轮远近<br>
    <kbd>空格</kbd> 触角动作 · <kbd>E</kbd> 打招呼 / 查看物件位 / 穿过出口<br>
    <kbd>M</kbd> 地图与传送（点地图任意处即传送） · <kbd>P</kbd> 粒子显示 · <kbd>H</kbd> 隐藏说明<br>
    把 Path Recognize 导出的 network JSON 拖进窗口，即可生成新的峡谷。
  </div>
</div>

<div id="minimap-wrap" class="panel">
  <canvas id="minimap"></canvas>
  <div class="cap">六边形是模块边框；浅色为可走的峡谷底，线是识别出的路径，黄圈是故事物件位，青色是出口。</div>
</div>

<div id="stats" class="panel">准备中…</div>
<div id="tool" class="panel" title="传送道具：打开地图，点击任意位置传送"><span class="ico"></span><span><kbd>M</kbd> 传送</span></div>
<div id="bigmap">
  <div class="frame panel">
    <div class="head"><b>模块地图</b><span id="bigmap-hint">点击地图上任意位置，蚂蚁会传送过去</span><button class="close">关闭（M）</button></div>
    <canvas id="bigmap-canvas"></canvas>
    <div class="waypoints"></div>
    <div class="modules"></div>
  </div>
</div>
<div id="prompt" class="panel"></div>
<div id="region"><div class="t"></div><div class="s"></div></div>
<div id="panel" class="panel"><div class="body"></div></div>
<div id="drop">松开即可用这份路径生成峡谷</div>

<div id="loading">
  <div class="box">
    <h2>正在生长峡谷</h2>
    <div class="track"><div id="loading-bar"></div></div>
    <div id="loading-label">准备中…</div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
